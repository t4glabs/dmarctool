<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}DMARCTool{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav>
  <a class="brand" href="/">DMARCTool</a>
  <a href="/">Overview</a>
  <a href="/other-domains">Other domains</a>
  <a href="/settings">Settings</a>
</nav>
<main>
{% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
{% block content %}{% endblock %}
</main>
<script>
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll(".tabs").forEach(function (tabs) {
    var buttons = Array.prototype.slice.call(tabs.querySelectorAll(".tab-btn"));
    var panels = Array.prototype.slice.call(tabs.querySelectorAll(".tab-panel"));
    var ids = buttons.map(function (b) { return b.dataset.tab; });

    function activate(id) {
      buttons.forEach(function (b) { b.classList.toggle("active", b.dataset.tab === id); });
      panels.forEach(function (p) { p.classList.toggle("active", p.dataset.tab === id); });
    }
    buttons.forEach(function (b) {
      b.addEventListener("click", function () {
        activate(b.dataset.tab);
        history.replaceState(null, "", "#" + b.dataset.tab);
      });
    });

    var hash = location.hash.replace("#", "");
    activate(ids.indexOf(hash) !== -1 ? hash : ids[0]);
  });

  document.querySelectorAll("dialog").forEach(function (dialog) {
    dialog.addEventListener("click", function (e) {
      if (e.target === dialog) dialog.close(); // click on the backdrop, not the content
    });
  });

  // Popovers (the small "i" fix-instruction buttons) get promoted to the browser's
  // top layer when open, which breaks their CSS position:absolute containing-block
  // chain back to the button that opened them -- this is the standard workaround
  // (also documented by MDN) until CSS anchor positioning is universally supported:
  // position it manually, relative to the viewport, once it's actually shown. The
  // popover "toggle" event doesn't bubble or get caught by ancestor listeners at
  // all, so this has to be attached directly on each popover, not delegated.
  document.querySelectorAll(".fix-popover").forEach(function (popover) {
    popover.addEventListener("toggle", function (e) {
      if (e.newState !== "open") return;
      var btn = document.querySelector('[popovertarget="' + popover.id + '"]');
      if (!btn) return;
      var r = btn.getBoundingClientRect();
      popover.style.position = "fixed";
      popover.style.top = (r.bottom + 4) + "px";
      popover.style.left = Math.min(r.left, window.innerWidth - popover.offsetWidth - 12) + "px";
    });
  });
});
</script>
</body>
</html>
