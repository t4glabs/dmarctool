<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}DMARCTool{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css?v={{ static_version('style.css') }}">
<meta name="csrf-token" content="{{ csrf_token(request) }}">
</head>
<body>
<script>
// Anti-flash: apply the collapsed state before the sidebar is even painted,
// synchronously, ahead of any other markup -- toggling the class after
// paint would show a visible snap on every page load.
try {
  if (localStorage.getItem("sidebarCollapsed") === "1") {
    document.documentElement.classList.add("sidebar-collapsed");
  }
} catch (e) {}
</script>
{% set current_path = request.url.path %}
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="mark">&#9993;&#65039;</span>
      <span class="wordmark">DMARCTool</span>
      <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-label="Collapse sidebar" title="Collapse sidebar">&#8249;</button>
    </div>
    <nav class="sidebar-nav">
      <a class="sidebar-link {{ 'active' if current_path == '/' or current_path.startswith('/domain/') else '' }}" href="/">
        <span class="icon">&#127760;</span><span class="label">Overview</span>
      </a>
      <a class="sidebar-link {{ 'active' if current_path == '/other-domains' else '' }}" href="/other-domains">
        <span class="icon">&#128269;</span><span class="label">Other domains</span>
      </a>
      <a class="sidebar-link {{ 'active' if current_path == '/settings' else '' }}" href="/settings">
        <span class="icon">&#9881;&#65039;</span><span class="label">Settings</span>
      </a>
      <a class="sidebar-link {{ 'active' if current_path == '/access_log' else '' }}" href="/access_log">
        <span class="icon">&#128274;</span><span class="label">Access log</span>
      </a>
    </nav>
  </aside>
  <div class="content-area">
    <main>
    {% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
    {% block content %}{% endblock %}
    </main>
  </div>
</div>
<script>
// CSRF: every POST form on the page gets the current csrf_token (from the
// <meta> tag above, itself sourced from this browser's csrf_token cookie --
// see the security_and_audit_middleware in app/web.py) injected as a hidden
// field right before it submits. Centralized here instead of hand-editing
// every <form method="post"> across every template. Delegated on "submit"
// so it covers forms added later too, but NOT programmatic form.submit()
// calls (that DOM method bypasses the submit event by spec) -- use
// form.requestSubmit() instead wherever a form submits itself via JS.
(function () {
  var meta = document.querySelector('meta[name="csrf-token"]');
  var token = meta ? meta.getAttribute("content") : null;
  if (!token) return;
  document.addEventListener("submit", function (e) {
    var form = e.target;
    if (!(form instanceof HTMLFormElement) || form.method.toLowerCase() !== "post") return;
    if (form.querySelector('input[name="csrf_token"]')) return;
    var input = document.createElement("input");
    input.type = "hidden";
    input.name = "csrf_token";
    input.value = token;
    form.appendChild(input);
  });
})();

document.addEventListener("DOMContentLoaded", function () {
  var sidebarToggle = document.getElementById("sidebar-toggle");
  if (sidebarToggle) {
    var setGlyph = function (collapsed) {
      sidebarToggle.textContent = collapsed ? "›" : "‹"; // › when collapsed (expand), ‹ when open (collapse)
      sidebarToggle.title = collapsed ? "Expand sidebar" : "Collapse sidebar";
    };
    setGlyph(document.documentElement.classList.contains("sidebar-collapsed"));
    sidebarToggle.addEventListener("click", function () {
      var collapsed = !document.documentElement.classList.contains("sidebar-collapsed");
      document.documentElement.classList.toggle("sidebar-collapsed", collapsed);
      setGlyph(collapsed);
      try { localStorage.setItem("sidebarCollapsed", collapsed ? "1" : "0"); } catch (e) {}
    });
  }

  document.querySelectorAll(".tabs").forEach(function (tabs) {
    var buttons = Array.prototype.slice.call(tabs.querySelectorAll(".tab-btn"));
    var panels = Array.prototype.slice.call(tabs.querySelectorAll(".tab-panel"));
    var ids = buttons.map(function (b) { return b.dataset.tab; });

    function activate(id) {
      buttons.forEach(function (b) { b.classList.toggle("active", b.dataset.tab === id); });
      panels.forEach(function (p) { p.classList.toggle("active", p.dataset.tab === id); });
    }
    buttons.forEach(function (b) {
      b.addEventListener("click", function () {
        activate(b.dataset.tab);
        history.replaceState(null, "", "#" + b.dataset.tab);
      });
    });

    var hash = location.hash.replace("#", "");
    activate(ids.indexOf(hash) !== -1 ? hash : ids[0]);
  });

  document.querySelectorAll("dialog").forEach(function (dialog) {
    dialog.addEventListener("click", function (e) {
      if (e.target === dialog) dialog.close(); // click on the backdrop, not the content
    });
  });

  // Popovers (the small "i" fix-instruction buttons) get promoted to the browser's
  // top layer when open, which breaks their CSS position:absolute containing-block
  // chain back to the button that opened them -- this is the standard workaround
  // (also documented by MDN) until CSS anchor positioning is universally supported:
  // position it manually, relative to the viewport, once it's actually shown. The
  // popover "toggle" event doesn't bubble or get caught by ancestor listeners at
  // all, so this has to be attached directly on each popover, not delegated.
  document.querySelectorAll(".fix-popover").forEach(function (popover) {
    popover.addEventListener("toggle", function (e) {
      if (e.newState !== "open") return;
      var btn = document.querySelector('[popovertarget="' + popover.id + '"]');
      if (!btn) return;
      var r = btn.getBoundingClientRect();
      popover.style.position = "fixed";
      popover.style.top = (r.bottom + 4) + "px";
      popover.style.left = Math.min(r.left, window.innerWidth - popover.offsetWidth - 12) + "px";
    });
  });
});
</script>
<script src="/static/chart-tooltip.js?v={{ static_version('chart-tooltip.js') }}"></script>
</body>
</html>
